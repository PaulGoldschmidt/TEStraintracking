services:
  tracker:
    build: .
    container_name: tes-gigatrain-tracker
    ports:
      - "127.0.0.1:5743:3000"
    volumes:
      - tracker-data:/app/data
    environment:
      - PORT=3000
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=10M
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  tracker-data:
